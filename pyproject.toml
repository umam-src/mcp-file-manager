[project]
name = "mcp-file-manager"
version = "0.7.0"
description = "MCP server untuk mengelola file lokal (read/write/list/edit/move)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10.0,<2",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
mcp-file-manager = "server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
